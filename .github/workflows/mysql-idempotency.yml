name: MySQL idempotency concurrency

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysql-idempotency-${{ github.repository }}
  cancel-in-progress: true

env:
  COMPOSER_CACHE_DIR: /tmp/composer-cache

jobs:
  mysql-8-4:
    name: MySQL 8.4 idempotency (phpunit.mysql.idempotency.xml)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: red_vecinal_testing
      DB_USERNAME: root
      DB_PASSWORD: ci_mysql_testing
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_mysql_testing
          MYSQL_DATABASE: red_vecinal_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_mysql_testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, tokenizer, bcmath, intl, pdo_mysql, curl, zip, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-cache-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-cache-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --force --ansi

      - name: Assert CI database safety (environment)
        run: |
          set -euo pipefail
          test "${APP_ENV}" = "testing"
          test "${DB_DATABASE}" = "red_vecinal_testing"
          test "${DB_HOST}" = "127.0.0.1"
          test "${DB_CONNECTION}" = "mysql"
          test "${DB_PORT}" = "3306"

      - name: Assert MySQL 8.4 identity
        run: |
          set -euo pipefail
          php -r '
          $host = getenv("DB_HOST") ?: "";
          $port = getenv("DB_PORT") ?: "";
          $database = getenv("DB_DATABASE") ?: "";
          $username = getenv("DB_USERNAME") ?: "";
          $password = getenv("DB_PASSWORD") !== false ? (string) getenv("DB_PASSWORD") : "";
          if ($host !== "127.0.0.1" || $port !== "3306" || $database !== "red_vecinal_testing") {
              fwrite(STDERR, "Destino MySQL de CI no aislado.".PHP_EOL);
              exit(1);
          }
          $dsn = sprintf("mysql:host=%s;port=%s;dbname=%s;charset=utf8mb4", $host, $port, $database);
          $pdo = new PDO($dsn, $username, $password, [
              PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
          ]);
          $version = (string) $pdo->query("SELECT VERSION()")->fetchColumn();
          if (! str_starts_with($version, "8.4.")) {
              fwrite(STDERR, "Se requiere MySQL 8.4.".PHP_EOL);
              exit(1);
          }
          $schema = (string) $pdo->query("SELECT DATABASE()")->fetchColumn();
          if ($schema !== "red_vecinal_testing") {
              fwrite(STDERR, "Base efectiva distinta de red_vecinal_testing.".PHP_EOL);
              exit(1);
          }
          echo "mysql_84_identity_ok".PHP_EOL;
          '

      - name: Assert Laravel effective MySQL config
        run: |
          set -euo pipefail
          php artisan config:clear --ansi
          php -r "
          require 'vendor/autoload.php';
          \$app = require 'bootstrap/app.php';
          \$app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          if ((string) config('app.env') !== 'testing') {
              fwrite(STDERR, 'APP_ENV efectivo distinto de testing.'.PHP_EOL);
              exit(1);
          }
          \$mysql = config('database.connections.mysql');
          if ((\$mysql['driver'] ?? null) !== 'mysql') {
              fwrite(STDERR, 'Driver MySQL efectivo incorrecto.'.PHP_EOL);
              exit(1);
          }
          if ((\$mysql['host'] ?? null) !== '127.0.0.1') {
              fwrite(STDERR, 'DB host efectivo incorrecto.'.PHP_EOL);
              exit(1);
          }
          if ((string) (\$mysql['port'] ?? '') !== '3306') {
              fwrite(STDERR, 'DB port efectivo incorrecto.'.PHP_EOL);
              exit(1);
          }
          if ((\$mysql['database'] ?? null) !== 'red_vecinal_testing') {
              fwrite(STDERR, 'Base de datos efectiva incorrecta.'.PHP_EOL);
              exit(1);
          }
          echo 'laravel_mysql_config_ok'.PHP_EOL;
          "

      - name: Migrate isolated testing database
        run: |
          php artisan config:clear --ansi
          php artisan migrate --force --ansi

      - name: Run MySQL idempotency concurrency suite
        run: |
          php artisan config:clear --ansi
          php artisan test -c phpunit.mysql.idempotency.xml --ansi
